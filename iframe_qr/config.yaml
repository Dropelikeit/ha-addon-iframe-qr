name: "Iframe QR Display"
version: "1.0.0"
slug: "iframe_qr"
description: "Zeigt eine konfigurierbare Webseite als Vollbild-Iframe mit QR-Code-Overlay in der Ecke"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
url: "https://github.com/marcelstrahl/ha-addon-iframe-qr"
startup: application
boot: auto
init: false
ingress: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Web-Oberfläche (Iframe + QR-Code)"
options:
  url: "https://google.com"
  qr_size: 230
  party_mode: false
  party_glow_reach: 14
schema:
  url: "url"
  qr_size: "int(50,400)"
  party_mode: "bool"
  party_glow_reach: "int(4,120)"
